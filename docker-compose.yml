services:
  cockroach:
    image: cockroachdb/cockroach:v25.4.18
    container_name: loci-crdb
    command: start-single-node --insecure
    ports:
      - "26257:26257" # SQL
      - "8091:8080"   # DB Console
    volumes:
      - loci-crdb-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  loci-crdb-data:
